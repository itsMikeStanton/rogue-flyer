name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/flying-game-joystick-hqYef
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build version
        run: |
          printf '{ "build": %s, "sha": "%s", "built": "%s" }\n' \
            "${{ github.run_number }}" \
            "$(echo "${GITHUB_SHA}" | cut -c1-7)" \
            "$(date -u +%Y-%m-%dT%H:%MZ)" > version.json
          cat version.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (build type = GitHub Actions) if not already on.
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The game is static (HTML + ES modules + CDN Three.js); ship the repo root.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
